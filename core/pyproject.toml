[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidevops-core"
version = "0.1.0"
description = "AI DevOps Agent Platform - Core Engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "aiosqlite>=0.20.0",
    "cryptography>=42.0.0",
    "paramiko>=3.4.0",
    "asyncssh>=2.14.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "keyring>=25.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
aidevops = "aidevops_cli.main:app"
aidevops-server = "aidevops.main:run_server"

[tool.hatch.build.targets.wheel]
packages = ["aidevops", "aidevops_cli"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
